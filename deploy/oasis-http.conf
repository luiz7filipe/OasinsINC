# Example only: configure your own domain, certificates, and trusted proxy ranges.
server {
    listen 80;
    listen [::]:80;
    server_name app.example.com www.app.example.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/oasinsinc-acme;
        try_files $uri =404;
    }
    location / { return 503; }
}
