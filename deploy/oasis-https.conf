# Example only: configure your own domain, certificates, and trusted proxy ranges.
server {
    listen 80;
    listen [::]:80;
    server_name app.example.com www.app.example.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/oasinsinc-acme;
        try_files $uri =404;
    }
    location / { return 301 https://app.example.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.app.example.com;
    ssl_certificate /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    return 301 https://app.example.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.example.com;
    ssl_certificate /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128k;
    # Configure trusted proxy IP ranges for your own deployment before enabling real-IP headers.
    # Avoid recording e-mail confirmation/reset tokens in URL access logs.
    access_log off;
    error_log /var/log/nginx/oasis-error.log crit;
    location / {
        proxy_pass http://127.0.0.1:4187;
        proxy_http_version 1.1;
        proxy_set_header Host app.example.com;
        proxy_set_header Connection "";
        proxy_set_header X-Oasis-Client-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
        proxy_buffering off;
    }
}
