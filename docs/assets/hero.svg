<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">OasinsINC — sua rotina, seu ritmo</title>
  <desc id="desc">Identidade editorial da Oasis em verde floresta e lima, com círculos e formas orgânicas que representam alimentação, água e rotina.</desc>
